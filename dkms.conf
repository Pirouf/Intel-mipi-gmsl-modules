PACKAGE_NAME="ipu-camera-sensor"
PACKAGE_VERSION="0.1"
VERSION_SUFFIX="${PACKAGE_VERSION}"

MAKE="make KERNELRELEASE=$kernelver DRIVER_VERSION_SUFFIX='${VERSION_SUFFIX}' KERNEL_SRC=$kernel_source_dir"
CLEAN="make KERNELRELEASE=$kernelver KERNEL_SRC=$kernel_source_dir clean"

AUTOINSTALL="yes"

BUILD_EXCLUSIVE_KERNEL="^(7\.([0)\.)|^(6\.(1[278])\.)|^6\.(1[27])rt-intel|^6\.(1[27])-intel"

#Extract kernel version substring that is used to identify source directory for kernel modules
# i.e 6.12.8-intel-ese-experimental-lts-rt ==>  6.12.0
# i.e 6.17.0-oem-1011 ==>  6.17.0
# i.e 6.17rt-intel ==>  6.17.0
# i.e 6.18.6-intel-ese-experimental-lts-rt ==>  6.18.0
SELECTED_KERNEL=$(echo $kernelver | cut -d- -f1 | sed -r 's/([0-9]+\.[0-9]+).*/\1.0/g')
KERNEL_VER=$(echo $kernelver | cut -d. -f1)
KERNEL_PATCH=$(echo $kernelver | cut -d. -f2 | cut -d- -f1)

MODULE_PATH="drivers/media/i2c"
MODULE_DEST="/kernel/drivers/media/i2c/"

POST_ADD="dkms-kernel-source.sh"

j=0

# V4l2 core patches OoT patches
POST_ADD+=" drivers/media/v4l2-core"
# kernel patches for Linux 6.12
PATCH[$j]="0001-dkms-v4l2-core-makefile-adaptation-6.12.patch"
PATCH_MATCH[$j]="^(6.1[2])"
PATCH[$((++j))]="0002-dkms-disable-tuner-build-in-v4l2-core-6.12.patch"
PATCH_MATCH[$j]="^(6.1[2])"
PATCH[$((++j))]="0003-drivers-media-set-v4l2_subdev_enable_streams_api-tru.patch"
PATCH_MATCH[$j]="^(6.1[2])"
# kernel patches for Linux 6.17
PATCH[$((++j))]="0004-dkms-v4l2-core-makefile-adaptation-6.17.patch"
PATCH_MATCH[$j]="^(6.1[7])"
PATCH[$((++j))]="0005-dkms-disable-tuner-build-in-v4l2-core-6.17.patch"
PATCH_MATCH[$j]="^(6.1[7])"
PATCH[$((++j))]="0006-drivers-media-set-v4l2_subdev_enable_streams_api-tru.patch"
PATCH_MATCH[$j]="^(6.1[7])"
# kernel patches for Linux 6.18
PATCH[$((++j))]="0007-dkms-v4l2-core-makefile-adaptation-6.18.patch"
PATCH_MATCH[$j]="^(6.1[8])"
PATCH[$((++j))]="0008-dkms-disable-tuner-build-in-v4l2-core-6.18.patch"
PATCH_MATCH[$j]="^(6.1[8])"
PATCH[$((++j))]="0009-Revert-media-v4l2-subdev-Make-struct-v4l2_subdev_str.patch"
PATCH_MATCH[$j]="^(6.1[8])"
PATCH[$((++j))]="0010-drivers-media-set-v4l2_subdev_enable_streams_api-tru.patch"
PATCH_MATCH[$j]="^(6.1[8])"
# kernel patches for Linux 7.0
PATCH[$((++j))]="0011-dkms-v4l2-core-makefile-adaptation-7.0.patch"
PATCH_MATCH[$j]="^(7.[0])"
PATCH[$((++j))]="0012-dkms-disable-tuner-build-in-v4l2-core-7.0.patch"
PATCH_MATCH[$j]="^(7.[0])"
PATCH[$((++j))]="0013-drivers-media-set-v4l2_subdev_enable_streams_api-tru.patch"
PATCH_MATCH[$j]="^(7.[0])"

# IPU6 drivers OoT patches
PATCH[$((++j))]="0050-isys-video-let-v4l2-set-default-colorspace.patch"
PATCH_MATCH[$j]="^(6.1[278])|^(7.[0])"
PATCH[$((++j))]="0051-ipu6-dkms-add-isys-makefile-adaptation-6.12.patch"
PATCH_MATCH[$j]="^(6.1[278])|^(7.[0])"
PATCH[$((++j))]="0052-ipu6-isys-disable-src_pad-validation-for-dkms.patch"
PATCH_MATCH[$j]="^(6.1[278])|^(7.[0])"
PATCH[$((++j))]="0053-Revert-ipu6-isys-lt6911uxc-2-pads-linked-to-ipu-2-po.patch"
PATCH_MATCH[$j]="^(6.1[278])|^(7.[0])"
PATCH[$((++j))]="0054-module-Add-version-conditional-for-symbol-namespace-.patch"
PATCH_MATCH[$j]="^(6.1[278])|^(7.[0])"

# IPU7 drivers OoT patches
PATCH[$((++j))]="0100-isys-video-let-v4l2-set-default-colorspace.patch"
PATCH_MATCH[$j]="^(6.1[278])|^(7.[0])"

i=0

BUILT_MODULE_NAME[$i]="ipu-acpi"
BUILT_MODULE_LOCATION[$i]="drivers/media/platform/intel"
DEST_MODULE_LOCATION[$i]="/updates"
STRIP[$i]=no

BUILT_MODULE_NAME[$((++i))]="ipu-acpi-pdata"
BUILT_MODULE_LOCATION[$i]="drivers/media/platform/intel"
DEST_MODULE_LOCATION[$i]="/updates"
