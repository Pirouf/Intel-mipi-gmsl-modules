BUILT_MODULE_NAME[$((++i))]="intel-ipu6-psys"
BUILT_MODULE_LOCATION[$i]="ipu6-drivers/drivers/media/pci/intel/ipu6/psys"
DEST_MODULE_LOCATION[$i]="/updates"
STRIP[$i]=no

POST_ADD+=" drivers/media/pci/intel/Kconfig drivers/media/pci/intel/Makefile drivers/media/pci/intel/ipu-bridge.c"
# kernel patches for Linux 6.12
PATCH[$((++j))]="0200-ipu-bridge-port-6.12.0-to-bkc.patch"
PATCH_MATCH[$j]="^(6.1[2]-intel)"
PATCH[$((++j))]="0201-ipu-bridge-6.12-makefile.patch"
PATCH_MATCH[$j]="^(6.1[2])"
PATCH[$((++j))]="0202-ipu-bridge-6.12-bkc-backport.patch"
PATCH_MATCH[$j]="^(6.1[2])"
PATCH[$((++j))]="0203-ipu-bridge-6.12-add-sensors.patch"
PATCH_MATCH[$j]="^(6.1[2])"
# kernel patches for Linux 6.17
PATCH[$((++j))]="0204-ipu-bridge-6.17-makefile.patch"
PATCH_MATCH[$j]="^(6.1[7])"
PATCH[$((++j))]="0205-ipu-bridge-6.17-bkc-backport.patch"
PATCH_MATCH[$j]="^(6.1[7])"
PATCH[$((++j))]="0206-ipu-bridge-6.17-add-sensors.patch"
PATCH_MATCH[$j]="^(6.1[7])"
# kernel patches for Linux 6.18
PATCH[$((++j))]="0207-ipu-bridge-6.18-makefile.patch"
PATCH_MATCH[$j]="^(6.1[8])"
PATCH[$((++j))]="0208-ipu-bridge-6.18-bkc-backport.patch"
PATCH_MATCH[$j]="^(6.1[8])"
PATCH[$((++j))]="0209-ipu-bridge-6.18-add-sensors.patch"
PATCH_MATCH[$j]="^(6.1[8])"
# kernel patches for Linux 7.0
PATCH[$((++j))]="0210-ipu-bridge-7.0-makefile.patch"
PATCH_MATCH[$j]="^(7.[0])"
PATCH[$((++j))]="0211-ipu-bridge-7.0-bkc-backport.patch"
PATCH_MATCH[$j]="^(7.[0])"
PATCH[$((++j))]="0212-ipu-bridge-7.0-add-sensors.patch"
PATCH_MATCH[$j]="^(7.[0])"

BUILT_MODULE_NAME[$((++i))]="ipu-bridge"
BUILT_MODULE_LOCATION[$i]="${SELECTED_KERNEL}/drivers/media/pci/intel"
DEST_MODULE_LOCATION[$i]="/updates"
STRIP[$i]=no

BUILT_MODULE_NAME[$((++i))]="videodev"
BUILT_MODULE_LOCATION[$i]="${SELECTED_KERNEL}/drivers/media/v4l2-core/"
DEST_MODULE_NAME[$i]="videodev"
DEST_MODULE_LOCATION[$i]="/updates"
STRIP[$i]=no

if [ "$KERNEL_VER" -ge 6 ] && [ "$KERNEL_PATCH" -ge 17 ]; then
# IPU7 drivers from submodule
BUILT_MODULE_NAME[$((++i))]="intel-ipu7"
BUILT_MODULE_LOCATION[$i]="ipu7-drivers/drivers/media/pci/intel/ipu7"
DEST_MODULE_LOCATION[$i]="/updates"
STRIP[$i]=no

BUILT_MODULE_NAME[$((++i))]="intel-ipu7-isys"
BUILT_MODULE_LOCATION[$i]="ipu7-drivers/drivers/media/pci/intel/ipu7"
DEST_MODULE_LOCATION[$i]="/updates"
