name: checkpatch review
on: [pull_request]

permissions:
  contents: read

jobs:
  my_review:
    name: checkpatch review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Download latest checkpatch.pl from kernel tree
        run: |
          base="https://raw.githubusercontent.com/torvalds/linux/master/scripts"
          for f in checkpatch.pl spelling.txt const_structs.checkpatch; do
            curl -fsSL "${base}/${f}" -o "$GITHUB_WORKSPACE/${f}"
          done
          chmod +x "$GITHUB_WORKSPACE/checkpatch.pl"
      - name: Run checkpatch review
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # EXCLUDE patch quilt from IPU7, IPU6 repos v4l2-core OoT
          # submodule repository does not maintain patch sign-off
          patch -p1 < patches/checkpatch/0001-checkpatch-add-option-for-excluding-directories.patch
          patch -p1 < patches/checkpatch/0002-checkpatch-skip-signature-styles-check-on-removed-pa.patch
          # FILE_PATH_CHANGES only prompts to update MAINTAINERS, which this
          # repository does not maintain. FSF_MAILING_ADDRESS also matches
          # required wording in the verbatim GPLv2 license text.
          git fetch --no-tags --prune origin "${BASE_REF}"
          MERGE_BASE="$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}")"
          ./checkpatch.pl --no-tree --show-types \
            --ignore FILE_PATH_CHANGES,FSF_MAILING_ADDRESS,MISSING_FIXES_TAG \
            --exclude patches \
            --exclude debian \
            --git "${MERGE_BASE}..${HEAD_SHA}"